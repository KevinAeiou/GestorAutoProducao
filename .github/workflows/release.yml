name: Release

# Publica uma release com o APK assinado sempre que uma tag de versão (v*) é enviada.
# Uso: git tag -a v1.0.1 -m "Versao 1.0.1" && git push origin v1.0.1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Conferir se a tag corresponde ao versionName
        run: |
          VERSAO_APP=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          VERSAO_TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSAO_APP" != "$VERSAO_TAG" ]; then
            echo "A tag ($VERSAO_TAG) difere do versionName em app/build.gradle ($VERSAO_APP)."
            exit 1
          fi

      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Gerar APK assinado
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "GestorAutoProducao-${GITHUB_REF_NAME}.apk"

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "GestorAutoProducao-${GITHUB_REF_NAME}.apk" \
            --title "Versão ${GITHUB_REF_NAME#v}" \
            --generate-notes
